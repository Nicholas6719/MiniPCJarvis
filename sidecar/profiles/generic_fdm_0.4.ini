# A generic 0.4 mm FDM profile — the default, and deliberately swappable via
# config fabrication.slicer_profile. It is not tuned for any printer he owns,
# because he owns none yet; it exists so slicing produces real numbers rather
# than failing for want of a config.
layer_height = 0.2
first_layer_height = 0.25
nozzle_diameter = 0.4
filament_diameter = 1.75
filament_density = 1.24
extrusion_width = 0.45
perimeters = 2
top_solid_layers = 4
bottom_solid_layers = 3
fill_density = 15%
fill_pattern = grid
support_material = 0
temperature = 210
first_layer_temperature = 215
bed_temperature = 60
first_layer_bed_temperature = 60
bridge_fan_speed = 100
max_print_height = 250
bed_shape = 0x0,220x0,220x220,0x220
gcode_flavor = marlin
